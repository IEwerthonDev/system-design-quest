<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Design Quest</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* Author `display: flex|grid|block` otherwise wins over the UA [hidden] rule. */
      [hidden] {
        display: none !important;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a2744;
      }
      #blueprint-root {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="blueprint-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
